<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070d">
  <title>Velha nunca mais</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070d;
      --panel: #0a0d16;
      --blue: #168cff;
      --blue-soft: #67bdff;
      --red: #ff3d55;
      --yellow: #ffd83d;
      --white: #edf5ff;
      --muted: #9aa9bd;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body {
      min-height: 100vh;
      padding: max(16px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom));
      color: var(--white);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(22,140,255,.2), transparent 42%),
        radial-gradient(circle at 10% 30%, rgba(255,61,85,.11), transparent 22%),
        radial-gradient(circle at 90% 66%, rgba(255,216,61,.09), transparent 25%),
        linear-gradient(180deg, #080b13 0%, #03050a 100%);
      overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5; z-index: 0;
      background-image: radial-gradient(#b9d9ff 0.7px, transparent 0.8px), radial-gradient(#168cff 0.6px, transparent 0.8px);
      background-size: 47px 47px, 83px 83px; background-position: 0 0, 17px 21px;
      mask-image: linear-gradient(to bottom, #000 0%, transparent 88%);
    }
    .project-cover { position: fixed; z-index: 50; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(12px, 3vh, 24px); padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom)); overflow: hidden; background: #000; }
    .project-cover[hidden] { display: none; }
    .cover-content { display: flex; flex-direction: column; align-items: center; gap: clamp(12px, 3vh, 24px); transform: translateY(-6vh); }
    .cover-image { display: block; width: min(88vw, 520px); max-height: 62vh; aspect-ratio: 1 / 1; object-fit: contain; }
    .cover-enter { min-width: 190px; min-height: 50px; padding: 10px 28px; border: 2px solid #edf5ff; border-radius: 12px; background: #05070d; color: #d9dee7; font: inherit; font-size: .95rem; font-style: italic; font-weight: 900; letter-spacing: .16em; cursor: pointer; box-shadow: 0 0 16px rgba(0,140,255,.18); }
    .cover-enter:active { transform: scale(.98); }
    .cover-signature { position: absolute; right: 20px; bottom: max(18px, env(safe-area-inset-bottom)); margin: 0; color: #c8ced8; font-size: .88rem; font-style: italic; letter-spacing: .04em; opacity: .84; }
    #gameApp[hidden] { display: none !important; }
    .app { position: relative; z-index: 1; width: min(100%, 520px); margin: 0 auto; }
    .topline { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 4px 0 8px; color: var(--yellow); font-size: .7rem; font-weight: 900; letter-spacing: .24em; text-transform: uppercase; }
    .topline::before, .topline::after { content: ""; width: 30px; height: 2px; background: linear-gradient(90deg, transparent, #008CFF); box-shadow: 0 0 8px rgba(0,140,255,.8); }
    .topline::after { transform: scaleX(-1); }
    .logo-topline { gap: 8px; }
    .logo-topline::before, .logo-topline::after { width: clamp(12px, 5vw, 30px); flex: 0 1 30px; }
    .logo-topline .samurai-avatar { display: block; flex: 0 0 auto; width: clamp(56px, 18vw, 74px); height: 74px; object-fit: contain; border-radius: 8px; }
    .logo-topline img:not(.samurai-avatar) { display: block; flex: 0 1 auto; width: min(47vw, 190px); height: 74px; object-fit: contain; border-radius: 5px; }
    .header-logo { margin: 0 0 12px; }
    h1 { text-align: center; margin: 0; line-height: 1.06; font-size: clamp(1.7rem, 7vw, 2.5rem); font-weight: 1000; letter-spacing: .03em; text-shadow: 0 0 18px rgba(22,140,255,.45); }
    h1 span { color: var(--blue-soft); }
    .subtitle { text-align: center; color: var(--muted); margin: 9px auto 18px; max-width: 38ch; font-size: .9rem; line-height: 1.45; }
    .mode-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: -7px 0 13px; }
    .mode-button { min-height: 48px; padding: 8px 7px; border: 1px solid rgba(22,140,255,.55); border-radius: 12px; background: #080b12; color: #b4c4d7; font: inherit; font-size: .72rem; font-weight: 850; line-height: 1.2; cursor: pointer; }
    .mode-button[aria-pressed="true"] { border-color: var(--yellow); background: linear-gradient(145deg, rgba(255,216,61,.14), rgba(22,140,255,.1)); color: var(--yellow); box-shadow: 0 0 13px rgba(255,216,61,.14); }
    .mode-button:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
    .arena { padding: 15px; border: 1px solid rgba(22,140,255,.72); border-radius: 22px; background-image: radial-gradient(circle, rgba(185,217,255,.8) .7px, transparent .95px), radial-gradient(circle, rgba(22,140,255,.7) .6px, transparent .9px), radial-gradient(ellipse at 50% 0%, rgba(22,140,255,.17), transparent 45%), linear-gradient(160deg, rgba(11,17,30,.97), rgba(5,7,13,.98)); background-size: 47px 47px, 83px 83px, auto, auto; background-position: 0 0, 17px 21px, center top, 0 0; box-shadow: 0 0 0 1px rgba(22,140,255,.13), 0 0 28px rgba(22,140,255,.14), inset 0 0 28px rgba(22,140,255,.035); }
    .score-heading { margin: 0 0 7px; color: var(--yellow); text-align: center; font-size: .72rem; line-height: 1; font-weight: 900; letter-spacing: .12em; }
    .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .score-card { position: relative; min-height: 68px; padding: 10px 12px; border: 1px solid rgba(22,140,255,.48); border-radius: 14px; background: #080b12; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; text-align: center; overflow: hidden; }
    .score-card::after { content: ""; position: absolute; width: 52px; height: 52px; border-radius: 50%; right: -18px; top: -25px; background: currentColor; filter: blur(22px); opacity: .23; }
    .score-card.x-card { color: var(--red); }
    .score-card.o-card { color: var(--blue-soft); }
    .score-symbol { font-size: 1.35rem; font-weight: 1000; }
    .score-symbol.mestre-quin-name { font-size: 1rem; letter-spacing: .01em; }
    .score-number { color: var(--white); font-size: 1.28rem; line-height: 1; font-weight: 900; }
    .turn { display: flex; align-items: center; justify-content: center; gap: 9px; min-height: 43px; margin: 0 0 12px; padding: 8px 12px; border: 1px solid rgba(255,216,61,.45); border-radius: 12px; background: rgba(255,216,61,.055); color: var(--yellow); font-size: .76rem; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; text-align: center; }
    .turn .turn-mark { font-size: 1.15rem; line-height: 1; }
    .turn.x-turn .turn-mark { color: var(--red); text-shadow: 0 0 14px rgba(255,61,85,.7); }
    .turn.o-turn .turn-mark { color: var(--blue-soft); text-shadow: 0 0 14px rgba(22,140,255,.8); }
    .board-wrap { position: relative; padding: 9px; border-radius: 19px; background: linear-gradient(135deg, rgba(22,140,255,.16), rgba(255,216,61,.09), rgba(255,61,85,.12)); box-shadow: 0 0 24px rgba(22,140,255,.13); }
    .board { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; aspect-ratio: 1 / 1; }
    .cell { appearance: none; width: 100%; height: 100%; min-width: 0; min-height: 0; border: 1.5px solid var(--blue); border-radius: 13px; background: linear-gradient(145deg, #0b101a, #070910); color: var(--white); font: inherit; font-size: clamp(3.15rem, 18vw, 5.8rem); font-weight: 1000; line-height: 1; display: grid; place-items: center; padding: 0; cursor: pointer; box-shadow: inset 0 0 17px rgba(22,140,255,.07), 0 0 8px rgba(22,140,255,.16); transition: transform .13s ease, background .15s ease, box-shadow .18s ease, border-color .18s ease; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .cell:active:not(:disabled) { transform: scale(.96); }
    .cell:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
    .cell.x { color: var(--red); border-color: #ff5368; text-shadow: 0 0 12px rgba(255,61,85,.72), 0 0 26px rgba(255,61,85,.28); animation: pop .2s ease-out; }
    .cell.o { color: var(--blue-soft); text-shadow: 0 0 12px rgba(22,140,255,.8), 0 0 26px rgba(22,140,255,.32); animation: pop .2s ease-out; }
    .cell.winner { transition: opacity .12s linear, filter .12s linear, background .12s linear, border-color .12s linear, box-shadow .12s linear; }
    .cell.winner.winner-blink-bright { opacity: 1; filter: brightness(1.45); background: rgba(255,216,61,.42); border-color: #fff0a0; box-shadow: 0 0 25px rgba(255,216,61,.95), inset 0 0 16px rgba(255,216,61,.25); }
    .cell.winner.winner-blink-dim { opacity: .16; filter: brightness(.4); background: rgba(255,216,61,.01); border-color: var(--yellow); box-shadow: 0 0 2px rgba(255,216,61,.15); }
    .winning-stroke { position: absolute; z-index: 10; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; color: var(--yellow); }
    .winning-stroke line { stroke: currentColor; stroke-width: 5; stroke-linecap: round; filter: drop-shadow(0 0 5px rgba(255,216,61,.9)); }
    .winning-stroke[hidden] { display: none; }
    .cell:disabled { cursor: default; opacity: 1; }
    @keyframes pop { from { transform: scale(.72); opacity: .55; } to { transform: scale(1); opacity: 1; } }
    .bottom-row { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 13px; }
    .restart { min-height: 46px; border: 1px solid var(--yellow); border-radius: 13px; background: linear-gradient(135deg, #30270b, #151208); color: var(--yellow); font: inherit; font-size: .78rem; font-weight: 900; letter-spacing: .11em; text-transform: uppercase; cursor: pointer; box-shadow: 0 0 13px rgba(255,216,61,.12); }
    .restart:active { transform: scale(.98); }
    .sound { min-width: 48px; min-height: 46px; border: 1px solid rgba(22,140,255,.6); border-radius: 13px; background: #080b12; color: var(--blue-soft); font-size: 1.2rem; cursor: pointer; }
    .sound[aria-pressed="false"] { color: var(--muted); border-color: rgba(154,169,189,.3); }
    .rules { margin: 13px 2px 0; padding: 11px 12px; border-left: 3px solid var(--blue); border-radius: 0 10px 10px 0; background: rgba(22,140,255,.055); color: #b4c4d7; font-size: .76rem; line-height: 1.5; }
    .rules strong { color: var(--yellow); }
    .rules-toolbar { display: flex; align-items: center; justify-content: space-between; margin: 0 0 2px; }
    .rules-game-title { display: block; margin-bottom: 8px; color: var(--yellow); font-size: 1.25rem; line-height: 1.15; font-weight: 1000; text-align: center; }
    .sound-inline, .gear-button { width: 36px; height: 36px; min-width: 36px; min-height: 36px; padding: 0; border-radius: 50%; display: grid; place-items: center; }
    .sound-inline { font-size: 1rem; }
    .gear-button { border: 1px solid rgba(22,140,255,.68); background: #080b12; color: var(--yellow); font-size: 1.1rem; cursor: pointer; box-shadow: 0 0 11px rgba(22,140,255,.18); }
    .settings-backdrop { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; padding: 18px; background: rgba(0,0,0,.76); backdrop-filter: blur(7px); }
    .settings-backdrop[hidden] { display: none; }
    .settings-dialog { width: min(100%, 420px); padding: 19px; border: 2px solid #008CFF; border-radius: 20px; background: radial-gradient(ellipse at 50% 0%, rgba(22,140,255,.18), transparent 55%), #090d16; box-shadow: 0 0 30px rgba(0,140,255,.3); }
    .settings-layout { width: min(100%, 420px); max-height: calc(100vh - 36px); max-height: calc(100dvh - 36px); display: flex; flex-direction: column; gap: 12px; overflow-y: auto; overscroll-behavior: contain; }
    .settings-layout > #blindGameButton { flex: 0 0 auto; margin-top: 0; }
    .settings-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 7px; }
    .settings-header h2 { margin: 0; color: var(--yellow); font-size: 1.15rem; letter-spacing: .08em; }
    .settings-close { width: 38px; height: 38px; border: 1px solid #008CFF; border-radius: 50%; background: #080b12; color: var(--blue-soft); font-size: 1.35rem; cursor: pointer; }
    .settings-intro { margin: 0 0 14px; color: #b4c4d7; font-size: .84rem; line-height: 1.45; }
    .difficulty-list { display: grid; gap: 9px; }
    .difficulty-button { display: grid; gap: 4px; width: 100%; padding: 12px 14px; border: 1.5px solid rgba(22,140,255,.62); border-radius: 13px; background: #080b12; color: var(--white); text-align: left; font: inherit; cursor: pointer; }
    .difficulty-button strong { color: var(--blue-soft); font-size: .95rem; }
    .difficulty-button span { color: #aab8ca; font-size: .75rem; line-height: 1.35; }
    .difficulty-button[aria-pressed="true"] { border-color: var(--yellow); background: rgba(255,216,61,.1); box-shadow: 0 0 13px rgba(255,216,61,.14); }
    .difficulty-button[aria-pressed="true"] strong { color: var(--yellow); }
    .save-level { width: 100%; min-height: 46px; margin-top: 12px; border: 1.5px solid var(--yellow); border-radius: 13px; background: linear-gradient(135deg, #30270b, #151208); color: var(--yellow); font: inherit; font-size: .82rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
    .save-level:active { transform: scale(.98); }
    .blind-game-button { text-transform: none; border: 2px solid #ff2638; box-shadow: 0 0 10px rgba(255,38,56,.95), 0 0 24px rgba(255,38,56,.58); }
    .settings-hint { margin: 12px 0 0; color: #8797ab; font-size: .72rem; line-height: 1.4; }
    .cell.expiring { position: relative; z-index: 1; outline: 4px solid var(--yellow); outline-offset: -5px; box-shadow: 0 0 17px rgba(255,216,61,.8), inset 0 0 18px rgba(255,216,61,.18); }
    .toast { position: fixed; z-index: 25; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 18px); width: min(88vw, 390px); padding: 12px 14px; border: 1px solid var(--yellow); border-radius: 13px; background: rgba(6,8,13,.96); color: var(--white); text-align: center; font-weight: 800; font-size: .84rem; box-shadow: 0 0 22px rgba(255,216,61,.18); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .footer { margin: 12px 0 2px; text-align: center; color: #64758a; font-size: .62rem; letter-spacing: .08em; }
    @media (max-width: 360px) { .arena { padding: 11px; } .board { gap: 6px; } .cell { border-radius: 10px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
  </style>
</head>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (() => {
      const boardElement = document.getElementById('board');
      const turnBar = document.getElementById('turnBar');
      const turnMark = document.getElementById('turnMark');
      const turnText = document.getElementById('turnText');
      const scoreXElement = document.getElementById('scoreX');
      const scoreOElement = document.getElementById('scoreO');
      const scoreXName = document.getElementById('scoreXName');
      const scoreOName = document.getElementById('scoreOName');
      const modeComputerButton = document.getElementById('modeComputer');
      const modeLocalButton = document.getElementById('modeLocal');
      const rulesGameTitle = document.getElementById('rulesGameTitle');
      const rulesDescription = document.getElementById('rulesDescription');
      const toast = document.getElementById('toast');
      const soundButton = document.getElementById('sound');
      const settingsButton = document.getElementById('settingsButton');
      const projectCover = document.getElementById('projectCover');
      const gameApp = document.getElementById('gameApp');
      const enterGameButton = document.getElementById('enterGameButton');
      const settingsBackdrop = document.getElementById('settingsBackdrop');
      const settingsClose = document.getElementById('settingsClose');
      const settingsSave = document.getElementById('settingsSave');
      const blindGameButton = document.getElementById('blindGameButton');
      const classicGameButton = document.getElementById('classicGameButton');
      const difficultyButtons = Array.from(document.querySelectorAll('[data-difficulty]'));
      const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      const cells = [];
      let board = Array(9).fill(null);
      let order = { X: [], O: [] };
      let mode = 'computer';
      let blindMode = false;
      let player = 'O';
      let lastStarter = { computer: 'O', local: null, blindComputer: 'O', blindLocal: null };
      let gameOver = false;
      let isDraw = false;
      let isThinking = false;
      let computerTimer = 0;
      let restartTimer = 0;
      const roundRestartDelay = 4000;
      let blindVisibleUntil = Array(9).fill(0);
      let blindPieceTimers = Array(9).fill(0);
      let winnerFlashTimer = 0;
      let winningLine = [];
      let wins = { computer: { X: 0, O: 0 }, local: { X: 0, O: 0 }, blindComputer: { X: 0, O: 0 }, blindLocal: { X: 0, O: 0 } };
      let toastTimer = 0;
      let soundOn = true;
      let audioContext = null;
      let backgroundMusicTimer = 0;
      let backgroundMusicStep = 0;
      let backgroundMusicGain = null;
      const backgroundNotes = [349.23, 440, 523.25, 659.25, 587.33, 523.25, 440, 349.23, 392, 466.16, 587.33, 698.46, 659.25, 587.33, 466.16, 392];
      let difficulty = 'easy';
      try {
        const savedDifficulty = window.localStorage.getItem('velhaNuncaMaisDifficulty');
        if (['easy', 'medium', 'hard'].includes(savedDifficulty)) difficulty = savedDifficulty;
      } catch (_) { /* O jogo continua usando o modo fácil se o armazenamento estiver bloqueado. */ }
      let selectedDifficulty = difficulty;

      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'cell';
        cell.setAttribute('role', 'gridcell');
        cell.setAttribute('aria-label', `Casa ${i + 1}, vazia`);
        cell.addEventListener('click', () => play(i));
        boardElement.appendChild(cell);
        cells.push(cell);
      }
      const svgNamespace = 'http://www.w3.org/2000/svg';
      const winningStroke = document.createElementNS(svgNamespace, 'svg');
      winningStroke.classList.add('winning-stroke');
      winningStroke.setAttribute('aria-hidden', 'true');
      winningStroke.setAttribute('focusable', 'false');
      const winningStrokeLine = document.createElementNS(svgNamespace, 'line');
      winningStroke.appendChild(winningStrokeLine);
      winningStroke.hidden = true;
      boardElement.appendChild(winningStroke);

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 1900);
      }

      function playTone(frequency, duration = 0.09, type = 'sine', volume = 0.08) {
        if (!soundOn) return;
        try {
          audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
          if (audioContext.state === 'suspended') audioContext.resume();
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = type;
          oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(volume, audioContext.currentTime + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start();
          oscillator.stop(audioContext.currentTime + duration);
        } catch (_) { /* Som opcional; o jogo continua sem áudio. */ }
      }

      function playBackgroundNote() {
        if (!soundOn || !audioContext || !backgroundMusicGain || gameApp.hidden) return;
        try {
          const now = audioContext.currentTime;
          const oscillator = audioContext.createOscillator();
          const noteGain = audioContext.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(backgroundNotes[backgroundMusicStep], now);
          backgroundMusicStep = (backgroundMusicStep + 1) % backgroundNotes.length;
          noteGain.gain.setValueAtTime(0.0001, now);
          noteGain.gain.exponentialRampToValueAtTime(0.05, now + 0.12);
          noteGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.88);
          oscillator.connect(noteGain);
          noteGain.connect(backgroundMusicGain);
          oscillator.start(now);
          oscillator.stop(now + 0.9);
        } catch (_) { /* A música de fundo é opcional. */ }
      }

      function startBackgroundMusic() {
        if (!soundOn || gameApp.hidden || backgroundMusicTimer) return;
        try {
          audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
          if (audioContext.state === 'suspended') audioContext.resume();
          if (!backgroundMusicGain) {
            backgroundMusicGain = audioContext.createGain();
            backgroundMusicGain.gain.value = 0.0001;
            backgroundMusicGain.connect(audioContext.destination);
          }
          const now = audioContext.currentTime;
          backgroundMusicGain.gain.cancelScheduledValues(now);
          backgroundMusicGain.gain.setValueAtTime(Math.max(backgroundMusicGain.gain.value, 0.0001), now);
          backgroundMusicGain.gain.exponentialRampToValueAtTime(0.45, now + 0.25);
          playBackgroundNote();
          backgroundMusicTimer = window.setInterval(playBackgroundNote, 950);
        } catch (_) { /* A música de fundo é opcional. */ }
      }

      function stopBackgroundMusic() {
        window.clearInterval(backgroundMusicTimer);
        backgroundMusicTimer = 0;
        if (backgroundMusicGain && audioContext) {
          const now = audioContext.currentTime;
          backgroundMusicGain.gain.cancelScheduledValues(now);
          backgroundMusicGain.gain.setValueAtTime(Math.max(backgroundMusicGain.gain.value, 0.0001), now);
          backgroundMusicGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
        }
      }

      function findWinner(mark, position = board) {
        return lines.find(line => line.every(index => position[index] === mark)) || [];
      }

      function applyMove(position, history, mark, index) {
        position[index] = mark;
        history[mark].push(index);
        let vanished = false;
        if (!blindMode && history[mark].length > 3) {
          const oldestIndex = history[mark].shift();
          if (position[oldestIndex] === mark) position[oldestIndex] = null;
          vanished = true;
        }
        return vanished;
      }

      function simulateMove(position, history, mark, index) {
        const nextBoard = position.slice();
        const nextOrder = { X: history.X.slice(), O: history.O.slice() };
        const vanished = applyMove(nextBoard, nextOrder, mark, index);
        return { board: nextBoard, order: nextOrder, vanished };
      }

      function chooseMediumComputerMove() {
        const available = board.reduce((list, value, index) => {
          if (value === null) list.push(index);
          return list;
        }, []);
        if (!available.length) return -1;

        let bestScore = -Infinity;
        let bestMoves = [];
        for (const index of available) {
          const afterX = simulateMove(board, order, 'X', index);
          if (findWinner('X', afterX.board).length) return index;

          let humanWins = 0;
          for (let humanIndex = 0; humanIndex < 9; humanIndex++) {
            if (afterX.board[humanIndex] !== null) continue;
            const afterO = simulateMove(afterX.board, afterX.order, 'O', humanIndex);
            if (findWinner('O', afterO.board).length) humanWins++;
          }

          let linePotential = 0;
          lines.forEach(line => {
            const xCount = line.filter(cell => afterX.board[cell] === 'X').length;
            const oCount = line.filter(cell => afterX.board[cell] === 'O').length;
            const emptyCount = line.filter(cell => afterX.board[cell] === null).length;
            if (oCount === 0 && xCount === 2 && emptyCount === 1) linePotential += 5;
            else if (oCount === 0 && xCount === 1 && emptyCount === 2) linePotential += 1;
          });
          const positionBonus = index === 4 ? 4 : ([0, 2, 6, 8].includes(index) ? 2 : 0);
          const score = -humanWins * 100 + linePotential + positionBonus + Math.random() * 0.2;
          if (score > bestScore) {
            bestScore = score;
            bestMoves = [index];
          } else if (score === bestScore) {
            bestMoves.push(index);
          }
        }
        return bestMoves[Math.floor(Math.random() * bestMoves.length)];
      }

      function chooseEasyComputerMove() {
        const available = board.reduce((list, value, index) => {
          if (value === null) list.push(index);
          return list;
        }, []);
        return available.length ? available[Math.floor(Math.random() * available.length)] : -1;
      }

      function evaluateHardPosition(position) {
        const weights = [0, 2, 14, 120];
        let score = 0;
        for (const line of lines) {
          const xCount = line.filter(index => position[index] === 'X').length;
          const oCount = line.filter(index => position[index] === 'O').length;
          if (!oCount) score += weights[xCount];
          if (!xCount) score -= weights[oCount];
        }
        if (position[4] === 'X') score += 3;
        if (position[4] === 'O') score -= 3;
        return score;
      }

      function searchHardPosition(position, history, nextMark, depth, alpha, beta) {
        if (findWinner('X', position).length) return 1000 + depth;
        if (findWinner('O', position).length) return -1000 - depth;
        if (depth <= 0) return evaluateHardPosition(position);

        const available = position.reduce((list, value, index) => {
          if (value === null) list.push(index);
          return list;
        }, []);
        if (!available.length) return evaluateHardPosition(position);

        if (nextMark === 'X') {
          let best = -Infinity;
          for (const index of available) {
            const next = simulateMove(position, history, 'X', index);
            best = Math.max(best, searchHardPosition(next.board, next.order, 'O', depth - 1, alpha, beta));
            alpha = Math.max(alpha, best);
            if (beta <= alpha) break;
          }
          return best;
        }

        let best = Infinity;
        for (const index of available) {
          const next = simulateMove(position, history, 'O', index);
          best = Math.min(best, searchHardPosition(next.board, next.order, 'X', depth - 1, alpha, beta));
          beta = Math.min(beta, best);
          if (beta <= alpha) break;
        }
        return best;
      }

      function chooseHardComputerMove() {
        const available = board.reduce((list, value, index) => {
          if (value === null) list.push(index);
          return list;
        }, []);
        if (!available.length) return -1;
        let bestScore = -Infinity;
        let bestMoves = [];
        for (const index of available) {
          const afterX = simulateMove(board, order, 'X', index);
          const score = searchHardPosition(afterX.board, afterX.order, 'O', 5, -Infinity, Infinity);
          if (score > bestScore) {
            bestScore = score;
            bestMoves = [index];
          } else if (score === bestScore) {
            bestMoves.push(index);
          }
        }
        return bestMoves[Math.floor(Math.random() * bestMoves.length)];
      }

      function chooseComputerMove() {
        if (difficulty === 'easy') return chooseEasyComputerMove();
        if (difficulty === 'hard') return chooseHardComputerMove();
        return chooseMediumComputerMove();
      }

      function clearWinningStroke() {
        winningStroke.hidden = true;
        winningStrokeLine.removeAttribute('x1');
        winningStrokeLine.removeAttribute('y1');
        winningStrokeLine.removeAttribute('x2');
        winningStrokeLine.removeAttribute('y2');
        winningStroke.remove();
      }

      function scheduleAutoRestart() {
        window.clearTimeout(restartTimer);
        restartTimer = window.setTimeout(() => {
          clearWinningStroke();
          newGame();
        }, roundRestartDelay);
      }

      function renderWinningStroke() {
        if (!gameOver || winningLine.length < 3) {
          clearWinningStroke();
          return;
        }
        if (!winningStroke.isConnected) boardElement.appendChild(winningStroke);
        const firstRect = cells[winningLine[0]].getBoundingClientRect();
        const lastRect = cells[winningLine[winningLine.length - 1]].getBoundingClientRect();
        const boardRect = boardElement.getBoundingClientRect();
        const x1 = firstRect.left + firstRect.width / 2 - boardRect.left;
        const y1 = firstRect.top + firstRect.height / 2 - boardRect.top;
        const x2 = lastRect.left + lastRect.width / 2 - boardRect.left;
        const y2 = lastRect.top + lastRect.height / 2 - boardRect.top;
        const dx = x2 - x1;
        const dy = y2 - y1;
        const distance = Math.hypot(dx, dy);
        const ux = dx / distance;
        const uy = dy / distance;
        const extension = Math.min(firstRect.width, firstRect.height) * 0.48;
        winningStrokeLine.setAttribute('x1', String(x1 - ux * extension));
        winningStrokeLine.setAttribute('y1', String(y1 - uy * extension));
        winningStrokeLine.setAttribute('x2', String(x2 + ux * extension));
        winningStrokeLine.setAttribute('y2', String(y2 + uy * extension));
        winningStroke.hidden = false;
      }

      function syncWinningCellFlash() {
        window.clearInterval(winnerFlashTimer);
        winnerFlashTimer = 0;
        const hasWinner = gameOver && !isDraw && winningLine.length === 3;
        cells.forEach((cell, index) => {
          const isWinner = hasWinner && winningLine.includes(index);
          cell.classList.toggle('winner', isWinner);
          cell.classList.remove('winner-blink-bright', 'winner-blink-dim');
        });
        if (!hasWinner) return;
        let bright = true;
        const flash = () => {
          cells.forEach((cell, index) => {
            const isWinner = winningLine.includes(index);
            cell.classList.toggle('winner-blink-bright', isWinner && bright);
            cell.classList.toggle('winner-blink-dim', isWinner && !bright);
          });
          bright = !bright;
        };
        flash();
        winnerFlashTimer = window.setInterval(flash, 280);
      }

      function currentScoreKey(selectedMode = mode) {
        if (!blindMode) return selectedMode;
        return selectedMode === 'computer' ? 'blindComputer' : 'blindLocal';
      }

      function revealPieceTemporarily(index) {
        if (!blindMode) return;
        window.clearTimeout(blindPieceTimers[index]);
        blindVisibleUntil[index] = Date.now() + 500;
        blindPieceTimers[index] = window.setTimeout(() => {
          blindVisibleUntil[index] = 0;
          blindPieceTimers[index] = 0;
          if (blindMode) render();
        }, 500);
      }

      function render() {
        const nextExpiringIndex = !blindMode && !gameOver && difficulty === 'easy' && order[player].length >= 3
          ? order[player][0]
          : -1;
        const revealWinningBoard = blindMode && gameOver && !isDraw && winningLine.length === 3;
        cells.forEach((cell, index) => {
          const mark = board[index];
          const markVisible = Boolean(mark) && (!blindMode || revealWinningBoard || Date.now() < blindVisibleUntil[index]);
          cell.textContent = markVisible ? mark : '';
          cell.classList.toggle('x', markVisible && mark === 'X');
          cell.classList.toggle('o', markVisible && mark === 'O');
          cell.classList.toggle('expiring', index === nextExpiringIndex);
          cell.disabled = Boolean(mark) || gameOver || isThinking || (mode === 'computer' && player !== 'O');
          const markDescription = !mark ? 'vazia' : (markVisible ? `marcada com ${mark}` : 'peça apagada');
          const label = `Casa ${index + 1}, ${markDescription}`;
          cell.setAttribute('aria-label', index === nextExpiringIndex ? `${label}, peça mais antiga que sairá na próxima jogada` : label);
        });
        rulesGameTitle.textContent = blindMode ? 'A velha cega' : 'Velha nunca mais!';
        rulesDescription.textContent = blindMode
          ? `Jogo tradicional ${mode === 'computer' ? 'contra Mestre Quin' : 'para duas pessoas'}: cada peça fica visível por 0,5 segundo e depois se apaga.`
          : 'Esse é um jogo da velha que nunca dá velha, ao inserir a 4ª peça a mais antiga desaparece. Será que você é capaz de vencer o mestre?';
        turnMark.textContent = player;
        turnText.textContent = isDraw ? 'Deu velha!' : (gameOver
          ? (mode === 'computer' ? (player === 'O' ? 'Eu venci!' : 'Mestre Quin venceu!') : `Jogador ${player} venceu!`)
          : (mode === 'computer' ? (isThinking ? 'Mestre Quin pensando…' : 'Sua vez · O') : `Vez do jogador ${player}`));
        turnBar.classList.toggle('x-turn', player === 'X');
        turnBar.classList.toggle('o-turn', player === 'O');
        scoreXElement.textContent = wins[currentScoreKey()].X;
        scoreOElement.textContent = wins[currentScoreKey()].O;
        scoreXName.textContent = mode === 'computer' ? 'Mestre Quin · X' : 'JOGADOR X';
        scoreXName.classList.toggle('mestre-quin-name', mode === 'computer');
        scoreOName.textContent = mode === 'computer' ? 'Eu · O' : 'JOGADOR O';
        modeComputerButton.setAttribute('aria-pressed', String(mode === 'computer'));
        modeLocalButton.setAttribute('aria-pressed', String(mode === 'local'));
        syncWinningCellFlash();
        renderWinningStroke();
      }

      function play(index) {
        if (gameOver || isThinking || (mode === 'computer' && player !== 'O') || board[index]) return;
        const mark = player;
        const vanished = applyMove(board, order, mark, index);
        revealPieceTemporarily(index);
        winningLine = findWinner(mark);
        if (winningLine.length) {
          gameOver = true;
          wins[currentScoreKey()][mark] += 1;
          playTone(mark === 'X' ? 660 : 880, 0.24, 'triangle');
          const winnerText = mode === 'computer' ? 'Eu venci! Mandou bem!' : `Jogador ${mark} venceu!`;
          showToast(`✨ ${winnerText}`);
          render();
          scheduleAutoRestart();
          return;
        }
        if (blindMode && board.every(Boolean)) {
          gameOver = true;
          isDraw = true;
          showToast('Deu velha! Empate.');
          render();
          scheduleAutoRestart();
          return;
        }
        playTone(mark === 'X' ? 420 : 520, 0.08);
        if (vanished) showToast(`A peça mais antiga do ${mark} desapareceu!`);
        if (mode === 'computer') {
          player = 'X';
          isThinking = true;
          render();
          computerTimer = setTimeout(computerMove, 2000);
        } else {
          player = mark === 'X' ? 'O' : 'X';
          render();
        }
      }

      function computerMove() {
        if (gameOver || mode !== 'computer') return;
        computerTimer = 0;
        const index = chooseComputerMove();
        if (index < 0) {
          isThinking = false;
          player = 'O';
          render();
          return;
        }
        const vanished = applyMove(board, order, 'X', index);
        revealPieceTemporarily(index);
        isThinking = false;
        winningLine = findWinner('X');
        if (winningLine.length) {
          gameOver = true;
          wins[currentScoreKey()].X += 1;
          playTone(660, 0.24, 'triangle');
          showToast('🤖 Mestre Quin venceu!');
        } else if (blindMode && board.every(Boolean)) {
          gameOver = true;
          isDraw = true;
          showToast('Deu velha! Empate.');
        } else {
          playTone(420, 0.08);
          if (vanished) showToast(`A peça mais antiga do X desapareceu!`);
          player = 'O';
        }
        render();
        if (gameOver) scheduleAutoRestart();
      }

      function startFreshGame(nextMode) {
        clearWinningStroke();
        blindPieceTimers.forEach(timer => window.clearTimeout(timer));
        blindPieceTimers = Array(9).fill(0);
        blindVisibleUntil = Array(9).fill(0);
        const starterKey = blindMode ? (nextMode === 'computer' ? 'blindComputer' : 'blindLocal') : nextMode;
        const previousStarter = lastStarter[starterKey];
        const firstMark = previousStarter === null
          ? (nextMode === 'computer' ? 'O' : 'X')
          : (previousStarter === 'O' ? 'X' : 'O');
        lastStarter[starterKey] = firstMark;
        board = Array(9).fill(null);
        order = { X: [], O: [] };
        player = firstMark;
        gameOver = false;
        isThinking = nextMode === 'computer' && firstMark === 'X';
        winningLine = [];
        isDraw = false;
        boardElement.appendChild(winningStroke);
        render();
        if (isThinking) computerTimer = setTimeout(computerMove, 2000);
        return firstMark;
      }

      function setMode(nextMode) {
        if (nextMode === mode) return;
        clearTimeout(computerTimer);
        clearTimeout(restartTimer);
        restartTimer = 0;
        computerTimer = 0;
        mode = nextMode;
        startFreshGame(mode);
        showToast(blindMode
          ? (mode === 'computer' ? 'A velha cega contra Mestre Quin.' : 'A velha cega para duas pessoas.')
          : (mode === 'computer' ? 'Modo contra Mestre Quin.' : 'Modo para duas pessoas neste celular.'));
      }

      function newGame() {
        clearTimeout(computerTimer);
        clearTimeout(restartTimer);
        restartTimer = 0;
        computerTimer = 0;
        const firstMark = startFreshGame(mode);
        if (mode === 'computer') {
          showToast(firstMark === 'X' ? 'Nova partida! Mestre Quin começa com X.' : 'Nova partida! Você começa com O.');
        } else {
          showToast(`Nova partida! Jogador ${firstMark} começa.`);
        }
        playTone(520, 0.08);
      }

      function syncDifficultyControls() {
        difficultyButtons.forEach(button => {
          button.setAttribute('aria-pressed', String(button.dataset.difficulty === selectedDifficulty));
        });
      }

      function openSettings() {
        selectedDifficulty = difficulty;
        syncDifficultyControls();
        settingsBackdrop.hidden = false;
        settingsClose.focus();
      }

      function closeSettings() {
        selectedDifficulty = difficulty;
        syncDifficultyControls();
        settingsBackdrop.hidden = true;
        settingsButton.focus();
      }

      function selectDifficulty(nextDifficulty) {
        if (!['easy', 'medium', 'hard'].includes(nextDifficulty)) return;
        selectedDifficulty = nextDifficulty;
        syncDifficultyControls();
      }

      function saveDifficulty() {
        difficulty = selectedDifficulty;
        try { window.localStorage.setItem('velhaNuncaMaisDifficulty', difficulty); } catch (_) { /* Persistência opcional. */ }
        render();
        const names = { easy: 'Fácil', medium: 'Médio', hard: 'Difícil' };
        closeSettings();
        showToast(`Nível ${names[difficulty]} salvo.`);
      }

      enterGameButton.addEventListener('click', () => {
        projectCover.hidden = true;
        gameApp.hidden = false;
        gameApp.focus();
        if (soundOn) {
          playTone(659.25, 0.16, 'sine', 0.032);
          window.setTimeout(startBackgroundMusic, 450);
        }
      });
      settingsButton.addEventListener('click', openSettings);
      settingsClose.addEventListener('click', closeSettings);
      settingsSave.addEventListener('click', saveDifficulty);
      blindGameButton.addEventListener('click', () => {
        closeSettings();
        clearTimeout(computerTimer);
        clearTimeout(restartTimer);
        computerTimer = 0;
        restartTimer = 0;
        blindMode = true;
        startFreshGame(mode);
        showToast(mode === 'computer' ? 'A velha cega contra Mestre Quin.' : 'A velha cega para duas pessoas.');
      });
      classicGameButton.addEventListener('click', () => {
        closeSettings();
        clearTimeout(computerTimer);
        clearTimeout(restartTimer);
        computerTimer = 0;
        restartTimer = 0;
        blindMode = false;
        startFreshGame(mode);
        showToast(mode === 'computer' ? 'Jogo contra Mestre Quin.' : 'Jogo para duas pessoas neste celular.');
      });
      settingsBackdrop.addEventListener('click', event => {
        if (event.target === settingsBackdrop) closeSettings();
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !settingsBackdrop.hidden) closeSettings();
      });
      difficultyButtons.forEach(button => button.addEventListener('click', () => selectDifficulty(button.dataset.difficulty)));

      window.addEventListener('resize', () => { if (gameOver) renderWinningStroke(); });
      modeComputerButton.addEventListener('click', () => setMode('computer'));
      modeLocalButton.addEventListener('click', () => setMode('local'));
      document.getElementById('restart').addEventListener('click', newGame);
      soundButton.addEventListener('click', () => {
        soundOn = !soundOn;
        soundButton.setAttribute('aria-pressed', String(soundOn));
        soundButton.setAttribute('aria-label', soundOn ? 'Desativar sons' : 'Ativar sons');
        soundButton.title = soundOn ? 'Sons ligados' : 'Sons desligados';
        soundButton.textContent = soundOn ? '♫' : '♪';
        if (soundOn) {
          playTone(660, 0.1);
          if (!gameApp.hidden) startBackgroundMusic();
        } else {
          stopBackgroundMusic();
        }
        showToast(soundOn ? 'Sons ativados' : 'Sons desligados');
      });

      syncDifficultyControls();
      render();
    })();
  </script>
</body>
</html>
